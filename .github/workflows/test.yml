name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          gleam-version: "1.19.2"
          rebar3-version: "3"
          # elixir-version: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: gleam deps download
      - run: npm install
      - run: gleam test --target erlang
      - run: gleam test --target javascript
      - run: gleam format --check src test
      - run: gleam docs build
      - name: build examples
        run: |
          set -e
          if [ ! -d examples ]; then exit 0; fi
          for manifest in $(find examples -name gleam.toml -not -path '*/build/*' | sort); do
            echo "::group::$(dirname "$manifest")"
            (cd "$(dirname "$manifest")" && gleam build --warnings-as-errors)
            echo "::endgroup::"
          done
